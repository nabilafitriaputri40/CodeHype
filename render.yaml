services:
  - type: web
    name: portable-seo-mirror
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPSTREAM_ORIGIN
        value: https://www.codehype.ai
      - key: UPSTREAM_ALIASES
        value: https://codehype.ai,http://www.codehype.ai,http://codehype.ai
      - key: PUBLIC_ORIGIN
        sync: false
      - key: ENABLE_INDEXING
        value: "true"
      - key: TRUST_PROXY
        value: "true"
